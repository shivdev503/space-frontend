# /etc/nginx/sites-available/spacewallah  (or /etc/nginx/conf.d/spacewallah.conf on Amazon Linux)
# Certbot adds the HTTPS (listen 443) block when you run:
#   sudo certbot --nginx -d spacewallah.com -d www.spacewallah.com

server {
    listen 80;
    server_name spacewallah.com www.spacewallah.com;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Hashed build assets never change, so browsers and Cloudflare can keep them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
