# Page cache for spacewallah.com: nginx keeps a copy of every public page and serves it in a few
# milliseconds instead of waiting 1–3 s for Next.js to render it. Pages refresh in the background
# every 10 minutes, so admin changes show up within ~10 minutes. Every deploy empties the cache
# (deploy/remote-deploy.sh), so cached pages never point at JS files from an old build.
#
# Install (http level, once):
#   sudo cp deploy/nginx-page-cache.conf /etc/nginx/conf.d/spacewallah-page-cache.conf
#   sudo cp deploy/nginx-page-cache-location.conf /etc/nginx/snippets/spacewallah-page-cache.conf
#   then add `include snippets/spacewallah-page-cache.conf;` inside `location / { … }` of the
#   HTTPS (listen 443) server block, and: sudo nginx -t && sudo systemctl reload nginx

# 1 GB of pages on disk, 50 MB of keys in memory (~400k pages); unused pages are dropped after 7 days.
proxy_cache_path /var/cache/nginx/spacewallah levels=1:2 keys_zone=spacewallah_pages:50m
                 max_size=1g inactive=7d use_temp_path=off;

# Never cache (or answer from cache) for signed-in hosts, the host dashboard, sign-up and the API.
map $cookie_spacewallah_listing_token $sw_signed_in {
    ""      0;
    default 1;
}

map $uri $sw_uncached_path {
    default                0;
    ~^/api/                1;
    ~^/add(/|$)            1;
    ~^/list-your-space     1;
    ~^/_next/              1;
}

map "$sw_signed_in$sw_uncached_path" $sw_skip_cache {
    "00"    0;
    default 1;
}
