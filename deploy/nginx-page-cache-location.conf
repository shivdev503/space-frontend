# Included inside `location / { … }` of the spacewallah.com server block (see nginx-page-cache.conf).

proxy_cache spacewallah_pages;

# One copy per URL. Next.js client navigations (RSC requests) fetch the same URL with these headers
# and get a different response, so they are part of the key (their `_rsc=` query param also differs).
proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url";

# Next.js marks every page `private, no-store` (meant for browsers; nginx still forwards it to them)
# and varies on headers already in the key above.
proxy_ignore_headers Cache-Control Expires Vary;

# Fresh for 10 minutes; after that the next visitor still gets the cached page at once while nginx
# fetches a new copy in the background. Errors and an overloaded server also get the last good copy.
proxy_cache_valid 200 10m;
proxy_cache_valid 301 308 1h;
proxy_cache_valid 404 410 1m;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
# The first request for an uncached page renders it once; others wait for that copy.
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;

# Signed-in hosts and private paths go straight to Next.js.
proxy_cache_bypass $sw_skip_cache;
proxy_no_cache $sw_skip_cache;

# Ask Next.js for uncompressed pages so one cached copy serves every browser; nginx gzips on the way out.
proxy_set_header Accept-Encoding "";

# HIT / MISS / STALE / UPDATING / BYPASS — check with: curl -sI https://spacewallah.com/ | grep -i x-cache
add_header X-Cache-Status $upstream_cache_status always;
